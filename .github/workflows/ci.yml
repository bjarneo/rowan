# Tests the frontend and the Go code, and makes a smoke build of the app.
# The release workflow calls this workflow before it builds the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run for the old commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Completion tests
        run: npm test

      - name: svelte-check
        run: npm run check

  go:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: rowanpw
          POSTGRES_DB: acme
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d acme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rowanpw
          MYSQL_DATABASE: shop
        ports:
          - 3306/tcp
        # The ping uses TCP. The temporary server that MySQL starts for its
        # first setup listens on the socket only, so the check waits for the
        # real server.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prowanpw --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go embeds frontend/dist, so go vet and go test need the build.
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet -tags webkit2_41 ./...

      - name: go test
        env:
          ROWAN_TEST_PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          ROWAN_TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          ROWAN_CONFIG_DIR: ${{ runner.temp }}/rowan-config
          ROWAN_CREDENTIALS: file
        run: go test ./...

  build:
    name: Smoke build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install the Wails CLI
        run: |
          wails_version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${wails_version}"
          wails version

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      - name: wails build
        run: wails build -tags webkit2_41 -m -nosyncgomod -ldflags "-X main.version=v0.0.0-ci"

      - name: Check the version output
        run: |
          out="$(build/bin/rowan --version)"
          echo "$out"
          test "$out" = "rowan v0.0.0-ci"
